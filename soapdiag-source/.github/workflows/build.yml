name: Build SoapDiag APK

on:
  push:
    branches: [soapdiag]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - run: sdkmanager "platforms;android-35" "build-tools;34.0.0"
      - run: python3 tests/test_source.py
      - run: gradle assembleDebug --no-daemon --stacktrace
      - run: cp app/build/outputs/apk/debug/app-debug.apk SoapDiag-1.0.apk
      - uses: actions/upload-artifact@v4
        with:
          name: SoapDiag-1.0-apk
          path: SoapDiag-1.0.apk
