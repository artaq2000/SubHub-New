name: Build SoapDiag APK

on:
  push:
    branches: [soapdiag]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare SoapDiag source
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d soapdiag-source ]; then
            marker=$(grep -n '^__SOAPDIAG_PAYLOAD__$' upload-soapdiag-1.0.sh | cut -d: -f1)
            test -n "$marker"
            tail -n +$((marker + 1)) upload-soapdiag-1.0.sh | base64 -d > source.zip
            echo '4fd1accb8263732ff19092982f1ca93b383745c5644fb0517d957a0ff3eaecb0  source.zip' | sha256sum -c -
            unzip -q source.zip
            mv soapdiag-project soapdiag-source
            git config user.name "SoapDiag Builder"
            git config user.email "soapdiag@local.invalid"
            git add soapdiag-source
            git commit -m "Materialize SoapDiag source"
            git push origin HEAD:soapdiag
          fi

      - name: Restore exact SoapDiag 1.16 player asset
        shell: bash
        run: |
          set -euo pipefail
          cat soapdiag-source/diag116.b64.part0* | tr -d '\n\r' | base64 -d > soapdiag-source/app/src/main/assets/diag.js
          echo '13549b4407a43190c6c4df30af057cf67c838c556ff20e1fad2c6ef9c2b1b1d6  soapdiag-source/app/src/main/assets/diag.js' | sha256sum -c -
          grep -q 'جارٍ تحضير الفيديو' soapdiag-source/app/src/main/assets/diag.js
          grep -q '__soapdiag_prepare_overlay' soapdiag-source/app/src/main/assets/diag.js

      - name: Run source tests
        run: python3 soapdiag-source/tests/test_source.py

      - name: Build debug APK
        working-directory: soapdiag-source
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SoapDiag-1.16-search-apk
          path: soapdiag-source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
