name: Build SoapDiag APK

on:
  push:
    branches: [soapdiag]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unpack SoapDiag source
        shell: bash
        run: |
          set -euo pipefail
          marker=$(grep -n '^__SOAPDIAG_PAYLOAD__$' upload-soapdiag-1.0.sh | cut -d: -f1)
          test -n "$marker"
          tail -n +$((marker + 1)) upload-soapdiag-1.0.sh | base64 -d > source.zip
          echo '4fd1accb8263732ff19092982f1ca93b383745c5644fb0517d957a0ff3eaecb0  source.zip' | sha256sum -c -
          unzip -q source.zip

      - name: Run source tests
        run: python3 soapdiag-project/tests/test_source.py

      - name: Build debug APK
        working-directory: soapdiag-project
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SoapDiag-1.0-apk
          path: soapdiag-project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error