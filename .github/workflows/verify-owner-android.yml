name: Verify owner downloader Android compilation

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - feature/owner-multiconnection-download-322-3-123
    paths:
      - 'android-bridge/**'
      - '.github/workflows/verify-owner-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-compile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-bridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Install Android SDK
        run: |
          SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Build isolated debug APK (no release signing or publishing)
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Upload debug test APK
        uses: actions/upload-artifact@v4
        with:
          name: SubHub-owner-downloader-debug-test
          path: android-bridge/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
