name: Test owner downloader components

on:
  workflow_dispatch:
  push:
    branches:
      - feature/owner-multiconnection-download-322-3-123
    paths:
      - 'android-bridge/app/src/main/java/com/artaq/subhub/HlsMediaPlaylist.java'
      - 'android-bridge/app/src/main/java/com/artaq/subhub/HlsTransportStreamDownloader.java'
      - 'android-bridge/app/src/main/java/com/artaq/subhub/SegmentedVideoDownloader.java'
      - 'android-bridge/tests/HlsMediaPlaylistTest.java'
      - '.github/workflows/test-owner-downloader.yml'

permissions:
  contents: read

jobs:
  compile-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile downloader and parser
        run: |
          mkdir -p /tmp/subhub-downloader-classes
          javac -d /tmp/subhub-downloader-classes \
            android-bridge/app/src/main/java/com/artaq/subhub/HlsMediaPlaylist.java \
            android-bridge/app/src/main/java/com/artaq/subhub/HlsTransportStreamDownloader.java \
            android-bridge/app/src/main/java/com/artaq/subhub/SegmentedVideoDownloader.java \
            android-bridge/tests/HlsMediaPlaylistTest.java
      - name: Test HLS playlist parsing
        run: java -cp /tmp/subhub-downloader-classes com.artaq.subhub.HlsMediaPlaylistTest
