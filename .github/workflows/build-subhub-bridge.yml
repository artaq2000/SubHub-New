name: Build SubHub 322.3.0

on:
  push:
    branches: [main]
    paths:
      - 'android-bridge/**'
      - '.github/workflows/build-subhub-bridge.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    defaults:
      run:
        working-directory: android-bridge
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Prepare Android SDK
        run: |
          SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Verify SubHub source
        run: python3 tests/test_source.py
      - name: Build APK
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Prepare official APK
        run: cp app/build/outputs/apk/debug/app-debug.apk ../SubHub-322.3.0.apk
      - uses: actions/upload-artifact@v4
        with:
          name: SubHub-322.3.0-apk
          path: SubHub-322.3.0.apk
      - name: Publish official APK
        working-directory: .
        run: |
          mkdir -p builds
          cp SubHub-322.3.0.apk builds/SubHub-322.3.0.apk
          git config user.name "SubHub Builder"
          git config user.email "subhub-builder@users.noreply.github.com"
          git add builds/SubHub-322.3.0.apk
          if ! git diff --cached --quiet; then
            git commit -m "Publish SubHub 322.3.0 APK [skip ci]"
            git push origin HEAD:main
          fi
