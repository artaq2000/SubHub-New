name: Build SubHub Android Bridge APK

on:
  push:
    branches: [onlyflix-android-bridge-v322]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    defaults:
      run:
        working-directory: android-bridge
    steps:
      - uses: actions/checkout@v4
        with:
          ref: onlyflix-android-bridge-v322
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Prepare Android SDK
        run: |
          SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - run: python3 tests/test_source.py
      - run: gradle assembleDebug --no-daemon --stacktrace
      - run: cp app/build/outputs/apk/debug/app-debug.apk ../SubHub-Android-Bridge-v1.apk
      - uses: actions/upload-artifact@v4
        with:
          name: SubHub-Android-Bridge-v1-apk
          path: SubHub-Android-Bridge-v1.apk
