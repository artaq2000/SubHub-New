<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>SubHub v329 — Inner Header Matrix</title><style>
body{margin:0;background:#07111f;color:#e8eef8;font-family:system-ui,-apple-system,Segoe UI,Tahoma,Arial;padding:18px}.card{max-width:760px;margin:0 auto 16px;background:#111d31;border:1px solid #2d4362;border-radius:20px;padding:18px;box-shadow:0 14px 40px #0006}.title{font-size:25px;font-weight:900;color:#f4b942;margin-bottom:10px}.muted{color:#a9b8cc;line-height:1.8}.row{display:grid;gap:10px;margin-top:14px}input,button{font:inherit;border-radius:14px;border:1px solid #385273;background:#0b1627;color:#fff;padding:14px}button{font-weight:900;cursor:pointer}button.primary{border-color:#f4b942;color:#f4b942}.status{margin-top:12px;padding:12px;border:1px solid #2c6;border-radius:12px;color:#76e0a4}.bad{border-color:#e66;color:#ff9b9b}.matrix{display:grid;gap:10px;margin-top:14px}.item{border:1px solid #334a69;border-radius:14px;padding:12px;background:#0b1627}.item.ok{border-color:#22c55e}.item.fail{border-color:#ef4444}.k{color:#8eb8ff;font-weight:800}.mono{direction:ltr;text-align:left;white-space:pre-wrap;overflow-wrap:anywhere;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;line-height:1.55;background:#07111f;border-radius:14px;padding:12px;max-height:360px;overflow:auto}.pill{display:inline-block;border:1px solid #516a8a;border-radius:999px;padding:3px 9px;margin:2px;font-size:12px}</style></head><body>
<div class="card"><div class="title">SubHub v329 — فحص منع المشغل الداخلي</div><div class="muted">هذا الاختبار لا يشغّل الفيديو ولا يغيّر الموقع. يطلب من Worker تجربة نفس رابط المشغل الداخلي بخمسة أشكال مختلفة من Referer وترويسات Chrome الحقيقية. الهدف أن نعرف هل 403 سببه الهيدرز أم أن Cloudflare يمنع Cloudflare Worker نفسه.</div>
<div class="row"><label>IMDb ID</label><input id="imdb" value="tt36893729"><label>رابط OnlyFlix</label><input id="source" value="https://onlyflix.to/ice-cream-man-2/"><button class="primary" id="go">ابدأ فحص الهيدرز</button><button id="copy">نسخ السجل</button></div><div id="status" class="status">جاهز</div></div>
<div class="card"><div class="title">النتائج</div><div id="inner" class="muted">inner: —</div><div id="matrix" class="matrix"></div></div>
<div class="card"><div class="title">السجل</div><pre id="log" class="mono"></pre></div>
<script>(function(){'use strict';const WORKER='https://subhub-uploader-v2.artaq2000.workers.dev',$=id=>document.getElementById(id);let seq=0,last=null;function stamp(){return new Date().toISOString().slice(11,23)}function safe(v){try{return typeof v==='string'?v:JSON.stringify(v)}catch(_){return String(v)}}function log(t,m,d){const s='['+(++seq)+']['+stamp()+']['+t+'] '+m+(d!==undefined?' | '+safe(d):'');$('log').textContent+=s+'\n';$('log').scrollTop=$('log').scrollHeight}function setStatus(t,bad){$('status').textContent=t;$('status').className='status'+(bad?' bad':'')}function render(j){last=j;$('inner').textContent='inner: '+(j.inner||'—');const box=$('matrix');box.innerHTML='';(j.results||[]).forEach(x=>{const el=document.createElement('div');el.className='item '+(x.ok?'ok':'fail');el.innerHTML='<div><span class="k">'+x.label+'</span> <span class="pill">HTTP '+x.status+'</span> <span class="pill">'+(x.site||'')+'</span></div><div class="muted">Referer: '+(x.referer||'—')+'</div><div class="muted">Title: '+(x.title||'—')+'</div><div class="mono">'+safe({server:x.server,cfRay:x.cfRay,contentType:x.contentType,bytes:x.bytes,sample:x.sample})+'</div>';box.appendChild(el)});if(j.ok)setStatus('يوجد اختبار واحد على الأقل نجح HTTP 2xx',false);else setStatus('كل محاولات Worker فشلت — راجع الحالات أدناه',true)}async function run(){const imdb=$('imdb').value.trim(),source=$('source').value.trim(),u=WORKER+'/onlyflix/diag-headers?imdb='+encodeURIComponent(imdb)+'&source='+encodeURIComponent(source)+'&_='+Date.now();$('go').disabled=true;setStatus('جارٍ الفحص…');log('TEST','diag-headers',{url:u});try{const r=await fetch(u,{cache:'no-store'}),txt=await r.text();let j;try{j=JSON.parse(txt)}catch(_){j={ok:false,error:'non-json',body:txt.slice(0,1500)}}log('HTTP','response',{status:r.status,data:j});render(j)}catch(e){setStatus('فشل الطلب: '+e,true);log('ERR','fetch',String(e))}finally{$('go').disabled=false}}$('go').onclick=run;$('copy').onclick=async()=>{const head='SubHub Inner Header Matrix v329\nUA: '+navigator.userAgent+'\nURL: '+location.href+'\nWORKER: '+WORKER+'\n\n',txt=head+$('log').textContent;try{await navigator.clipboard.writeText(txt);setStatus('تم نسخ السجل ✅')}catch(_){prompt('انسخ السجل:',txt)}};log('INFO','v329 loaded',{worker:WORKER,origin:location.origin});})();</script></body></html>
