<div class="modal-bg" id="embedPlayerModal">

  <div class="video-modal-box">

    <button class="player-ui-trigger" id="embedUiTrigger" onclick="togglePlayerBar('embed')" title="أدوات المشغّل">

      <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><circle cx="12" cy="5" r="1.8"></circle><circle cx="12" cy="12" r="1.8"></circle><circle cx="12" cy="19" r="1.8"></circle></svg>

    </button>

    <div class="yt-modal-top collapsible" id="embedTopBar">

      <button class="video-top-btn yt-close-btn" id="embedFsBtn" onclick="toggleEmbedFullscreen()" title="ملء الشاشة">

        <svg id="embedFsIconExpand" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 3 21 3 21 9"></polyline><polyline points="9 21 3 21 3 15"></polyline><line x1="21" y1="3" x2="14" y2="10"></line><line x1="3" y1="21" x2="10" y2="14"></line></svg>

        <svg id="embedFsIconCollapse" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;"><polyline points="4 14 10 14 10 20"></polyline><polyline points="20 10 14 10 14 4"></polyline><line x1="14" y1="10" x2="21" y2="3"></line><line x1="3" y1="21" x2="10" y2="14"></line></svg>

      </button>

      <button class="video-top-btn yt-close-btn" id="embedStretchBtn" onclick="toggleEmbedStretch()" title="عرض الصورة: ١٠٠٪">
        <span id="embedScreenModeIconV341" class="screen-mode-icon-v341">١٠٠</span>
      </button>

      <button class="video-top-btn yt-close-btn" id="embedCcBtn" onclick="toggleSubtitleModal()" title="الترجمة" style="display:none;">

        <span style="font-size:0.7rem; font-weight:800;">CC</span>

      </button>

      <button class="video-top-btn yt-close-btn" onclick="closeEmbedPlayer()" title="إغلاق">

        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="6" y1="6" x2="18" y2="18"></line><line x1="18" y1="6" x2="6" y2="18"></line></svg>

      </button>

    </div>

    <div id="embedFrameContainer" class="video-frame-wrap" style="position:relative; width:100%; aspect-ratio:16/9; background:#000; overflow:hidden;"></div>

<div class="sub-panel" id="subPanel">

        <div class="sub-panel-head">

          <h4>✨ إعدادات الترجمة</h4>

          <button type="button" class="sub-panel-close" onclick="closeSubtitleModal()">✕</button>

        </div>

        <!-- v100: التبويبات بدل قائمة واحدة طويلة — كل تبويب يظهر كاملاً

             بلا تمرير، وأي إعداد جديد يدخل تبويبه بلا ما تكبر اللوحة. -->

        <div class="sub-tabs">

          <button type="button" class="sub-tab active" data-tab="track" onclick="switchSubTab('track')">💬 الترجمة</button>

          <button type="button" class="sub-tab" data-tab="look" onclick="switchSubTab('look')">🎨 المظهر</button>

          <button type="button" class="sub-tab" data-tab="font" onclick="switchSubTab('font')">✍️ الخط</button>

          <button type="button" class="sub-tab" data-tab="sync" onclick="switchSubTab('sync')">⏱️ المزامنة</button>

        </div>



        <div class="sub-tab-pane active" data-pane="track">

          <div class="sub-section-title">اختر الترجمة</div>

          <div id="subTrackList"></div>

          <div class="sub-src-row">

          <button class="link-btn" onclick="document.getElementById('subFileInput').click()">📁 من الجهاز</button>

          <button class="link-btn" onclick="openAddSubUrlModal()">🔗 رابط يدوي</button>

          </div>

          <input type="file" id="subFileInput" accept=".srt,.vtt,.ass,.ssa,.sub,text/plain" style="display:none;" onchange="handleLocalSubtitleFile(event)">

        </div>



        <div class="sub-tab-pane" data-pane="look">

          <div class="sub-settings-row">

          <label>حجم الخط</label>

          <div class="sub-pos-controls">

          <button type="button" class="pos-btn" onclick="adjustSubtitleSize(-10)">−</button>

          <span class="sub-val" id="subSizeValue">100%</span>

          <button type="button" class="pos-btn" onclick="adjustSubtitleSize(10)">+</button>

          </div>

          </div>

          <div class="sub-settings-row">

          <label>لون الخط</label>

          <div class="color-swatch-row" id="fontColorRow">

          <button type="button" class="color-swatch" style="background:#ffffff" onclick="setSubtitleColor('#ffffff', this)" title="أبيض"></button>

          <button type="button" class="color-swatch" style="background:#ffee00" onclick="setSubtitleColor('#ffee00', this)" title="أصفر"></button>

          <button type="button" class="color-swatch" style="background:#00e5ff" onclick="setSubtitleColor('#00e5ff', this)" title="سماوي"></button>

          <button type="button" class="color-swatch" style="background:#a8ffb4" onclick="setSubtitleColor('#a8ffb4', this)" title="أخضر فاتح"></button>

          </div>

          </div>

          <div class="sub-settings-row">

          <label>لون الخلفية</label>

          <div class="color-swatch-row" id="bgColorRow">

          <button type="button" class="color-swatch" style="background:#000000" onclick="setSubtitleBgColor('#000000', this)" title="أسود"></button>

          <button type="button" class="color-swatch" style="background:#16202e" onclick="setSubtitleBgColor('#16202e', this)" title="كحلي غامق"></button>

          </div>

          </div>

          <div class="sub-settings-row">

          <label>سواد الخلفية</label>

          <div class="sub-pos-controls">

          <button type="button" class="pos-btn" onclick="adjustSubtitleOpacity(-10)">−</button>

          <span class="sub-val" id="subOpacityValue">60%</span>

          <button type="button" class="pos-btn" onclick="adjustSubtitleOpacity(10)">+</button>

          </div>

          </div>

          <div class="sub-settings-row">

          <label>ظل الخط</label>

          <div class="sub-pos-controls">

          <button type="button" class="pos-btn" onclick="adjustSubtitleShadow(-0.5)">−</button>

          <span class="sub-val" id="subShadowValue">1.5</span>

          <button type="button" class="pos-btn" onclick="adjustSubtitleShadow(0.5)">+</button>

          </div>

          </div>

          <div class="sub-settings-row">

          <label>موضع الترجمة</label>

          <div class="sub-pos-controls">

          <button type="button" class="pos-btn" onclick="adjustSubtitlePosition(-2)">▼</button>

          <span class="sub-val" id="subPosValue">7%</span>

          <button type="button" class="pos-btn" onclick="adjustSubtitlePosition(2)">▲</button>

          </div>

          </div>

        </div>



        <div class="sub-tab-pane" data-pane="font">

          <div class="sub-settings-row">

          <label>الخط</label>

          <div class="font-choice-row" id="fontChoiceRow">

          <button type="button" class="font-choice-btn" data-font="default" onclick="setSubtitleFont('default', this)">افتراضي</button>

          <button type="button" class="font-choice-btn" data-font="typesetting" onclick="setSubtitleFont('typesetting', this)">فني</button>

          <button type="button" class="font-choice-btn" data-font="naskh" onclick="setSubtitleFont('naskh', this)">نسخي</button>

          </div>

          </div>

          <div class="sub-settings-row">

          <label>سماكة الخط</label>

          <div class="font-choice-row" id="weightChoiceRow">

          <button type="button" class="font-choice-btn" data-weight="300" onclick="setSubtitleWeight(300, this)">نحيف</button>

          <button type="button" class="font-choice-btn" data-weight="500" onclick="setSubtitleWeight(500, this)">وسط</button>

          <button type="button" class="font-choice-btn" data-weight="800" onclick="setSubtitleWeight(800, this)">عريض</button>

          </div>

          </div>

          <div class="sub-settings-row vip" id="subVipFontRow">

          <label>خطوط إضافية</label>

          <div class="font-choice-row" id="vipFontChoiceRow">

          <button type="button" class="font-choice-btn" data-font="cairo" onclick="setSubtitleFont('cairo', this)">القاهرة</button>

          <button type="button" class="font-choice-btn" data-font="almarai" onclick="setSubtitleFont('almarai', this)">المراعي</button>

          <button type="button" class="font-choice-btn" data-font="amiri" onclick="setSubtitleFont('amiri', this)">أميري</button>

          </div>

          </div>

        </div>



        <div class="sub-tab-pane" data-pane="sync">

          <div class="sub-pane-hint">لو الترجمة سابقة الكلام أو متأخّرة عنه، اضبطها من هنا. تُصفّر مع كل ترجمة جديدة.</div>

          <div class="sub-settings-row vip" id="subSyncRow">

            <label>مزامنة الترجمة</label>

            <div class="sub-pos-controls">

              <button type="button" class="pos-btn" onclick="adjustSubOffset(-0.25)">−</button>

              <span class="sub-val" id="subOffsetValue">0 ث</span>

              <button type="button" class="pos-btn" onclick="adjustSubOffset(0.25)">+</button>

            </div>

            <button type="button" class="sync-reset" onclick="adjustSubOffset(0, true)" title="تصفير">↺</button>

          </div>

        </div>

      </div></div></div>
