<div class="modal-bg" id="embedPlayerModal">

  <div class="video-modal-box">

    <button class="player-ui-trigger" id="embedUiTrigger" onclick="togglePlayerBar('embed')" title="أدوات المشغّل">

      <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><circle cx="12" cy="5" r="1.8"></circle><circle cx="12" cy="12" r="1.8"></circle><circle cx="12" cy="19" r="1.8"></circle></svg>

    </button>

    <div class="yt-modal-top collapsible" id="embedTopBar">

      <button class="video-top-btn yt-close-btn" id="embedFsBtn" onclick="toggleEmbedFullscreen()" title="ملء الشاشة">

        <svg id="embedFsIconExpand" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 3 21 3 21 9"></polyline><polyline points="9 21 3 21 3 15"></polyline><line x1="21" y1="3" x2="14" y2="10"></line><line x1="3" y1="21" x2="10" y2="14"></line></svg>

        <svg id="embedFsIconCollapse" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;"><polyline points="4 14 10 14 10 20"></polyline><polyline points="20 10 14 10 14 4"></polyline><line x1="14" y1="10" x2="21" y2="3"></line><line x1="3" y1="21" x2="10" y2="14"></line></svg>

      </button>

      <button class="video-top-btn yt-close-btn" id="embedStretchBtn" onclick="toggleEmbedStretch()" title="عرض الصورة: ١٠٠٪">
        <span id="embedScreenModeIconV341" class="screen-mode-icon-v341">١٠٠</span>
      </button>

      <button class="video-top-btn yt-close-btn" id="embedCcBtn" onclick="toggleSubtitleModal()" title="الترجمة" style="display:none;">

        <span style="font-size:0.7rem; font-weight:800;">CC</span>

      </button>

      <button class="video-top-btn yt-close-btn" onclick="closeEmbedPlayer()" title="إغلاق">

        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="6" y1="6" x2="18" y2="18"></line><line x1="18" y1="6" x2="6" y2="18"></line></svg>

      </button>

    </div>

    <div id="embedFrameContainer" class="video-frame-wrap" style="position:relative; width:100%; aspect-ratio:16/9; background:#000; overflow:hidden;"></div>

<div id="subPanel" class="sub-panel"></div></div></div>
